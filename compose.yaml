# ================================
# 🧩 BgaGO Laravel + MQTT + MySQL
# ================================

services:
  # =======================================
  # LARAVEL APP
  # =======================================
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.3
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
        WWWUSER: '${WWWUSER}'
    image: sail-8.3/app
    container_name: bgago-laravel.test-1
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8000}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER:-1000}' # UID del usuario 'sail'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'
      XDEBUG_CONFIG: 'client_host=host.docker.internal'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql
      - mosquitto
    command: >
      bash -c "pnpm install && pnpm run dev & php artisan serve --host=0.0.0.0 --port=80"

  # =======================================
  # PHPMYADMIN
  # =======================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: sail
      PMA_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
      UPLOAD_LIMIT: 50M
    networks:
      - sail
    depends_on:
      - mysql

  # =======================================
  # MYSQL
  # =======================================
  mysql:
    image: 'mysql:8.0'
    container_name: mysql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: transportes_db
      MYSQL_USER: sail
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-psecret']
      retries: 3
      timeout: 5s

  # =======================================
  # 📡 MOSQUITTO MQTT BROKER
  # =======================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: always
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./iot/mosquitto/config:/mosquitto/config
      - ./iot/mosquitto/data:/mosquitto/data
      - ./iot/mosquitto/log:/mosquitto/log
    networks:
      - sail

  # =======================================
  # PYTHON PUBLISHER
  # =======================================
  publisher:
    build:
      context: ./iot/publisher
      dockerfile: Dockerfile
    container_name: publisher
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - BROKER_HOST=mosquitto
      - BROKER_PORT=1883
      - LARAVEL_API=http://laravel.test/api/telemetria
    networks:
      - sail

  # =======================================
  # PYTHON SUBSCRIBER
  # =======================================
  subscriber:
    build:
      context: ./iot/subscriber
      dockerfile: Dockerfile
    container_name: subscriber
    restart: unless-stopped
    depends_on:
      - mosquitto
      - laravel.test
    environment:
      - BROKER_HOST=mosquitto
      - BROKER_PORT=1883
      - LARAVEL_API=http://laravel.test/api/telemetria
    networks:
      - sail

# =======================================
# REDES Y VOLUMENES
# =======================================
networks:
  sail:
    driver: bridge

volumes:
  mysql_data:
    driver: local
