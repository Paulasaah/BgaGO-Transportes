# ================================
# BgaGO Laravel + MQTT + MySQL
# ================================

services:
  # =======================================
  # LARAVEL APP
  # =======================================
  laravel.test:
    build:
      context: ./docker/8.3
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
        WWWUSER: '${WWWUSER}'
    image: bgago-laravel:8.3
    container_name: bgago-laravel.test-1
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-8000}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
      - '${REVERB_PORT:-6001}:${REVERB_PORT:-6001}'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'
      XDEBUG_CONFIG: 'client_host=host.docker.internal'
      RUN_MIGRATIONS_ON_START: '${RUN_MIGRATIONS_ON_START:-true}'
      RUN_SEEDERS_ON_START: '${RUN_SEEDERS_ON_START:-true}'
    volumes:
      - '.:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql
      - mosquitto

  # =======================================
  # MYSQL
  # =======================================
  mysql:
    image: 'mysql:8.0'
    container_name: mysql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: transportes_db
      MYSQL_USER: sail
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-psecret']
      retries: 3
      timeout: 5s

  # =======================================
  # MOSQUITTO MQTT BROKER
  # =======================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: always
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./iot/mosquitto/config:/mosquitto/config
      - ./iot/mosquitto/data:/mosquitto/data
      - ./iot/mosquitto/log:/mosquitto/log
    networks:
      - sail

  # =======================================
  # PYTHON PUBLISHER
  # =======================================
  publisher:
    build:
      context: ./iot/publisher
      dockerfile: Dockerfile
    container_name: publisher
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - BROKER_HOST=mosquitto
      - BROKER_PORT=1883
      - LARAVEL_API=http://laravel.test/api/telemetria
    networks:
      - sail

  # =======================================
  # OSRM Routing Engine
  # =======================================
  osrm:
    image: osrm/osrm-backend
    container_name: osrm
    ports:
      - '5000:5000'
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/colombia-latest.osrm
    networks:
      - sail
    restart: unless-stopped

# =======================================
# REDES Y VOLUMENES
# =======================================
networks:
  sail:
    driver: bridge

volumes:
  mysql_data:
    driver: local
